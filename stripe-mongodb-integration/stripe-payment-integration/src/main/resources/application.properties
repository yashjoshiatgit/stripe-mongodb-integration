spring.application.name=stripe-payment-integration
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_change_me}
stripe.checkout.success-url=${STRIPE_SUCCESS_URL:http://localhost:8080/success}
stripe.checkout.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8080/cancel}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}
clients.notification.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8081}
clients.notification.enabled=${NOTIFICATION_SERVICE_ENABLED:false}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/stripe_db}
spring.data.mongodb.database=stripe_db
